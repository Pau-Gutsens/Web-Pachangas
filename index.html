<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Pachangas FC — Web privada y ranking SR para pachangas de fútbol informal entre amigos">
  <meta name="theme-color" content="#0A130E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pachangas FC — Fútbol con Amigos</title>
  
  <!-- Tipografía moderna deportiva: Outfit e Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== APP CONTAINER ===== -->
  <div id="app" class="app-wrapper">
    
    <!-- HEADER FIJO -->
    <header class="app-header">
      <div class="header-content">
        <div class="header-brand">
          <span class="brand-logo">⚽</span>
          <span class="brand-name">PACHANGAS FC</span>
        </div>
        <h2 id="app-header-title" class="header-section-title">🏆 Ranking Pachanguero</h2>
      </div>
    </header>

    <!-- CONTENEDORES DE PÁGINAS (VISTAS) -->
    <main class="app-main">
      <section id="view-ranking" class="app-page active"></section>
      <section id="view-equipos" class="app-page"></section>
      <section id="view-registro" class="app-page"></section>
      <section id="view-historico" class="app-page"></section>
      <section id="view-jugadores" class="app-page"></section>
    </main>

    <!-- NAVEGACIÓN INFERIOR (BOTTOM NAV) -->
    <nav class="bottom-nav" role="navigation" aria-label="Navegación principal">
      <button class="nav-item active" data-page="ranking" id="nav-ranking">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">Ranking</span>
      </button>

      <button class="nav-item" data-page="equipos" id="nav-equipos">
        <span class="nav-icon">🎽</span>
        <span class="nav-label">Equipos</span>
      </button>

      <button class="nav-item nav-item-highlight" data-page="registro" id="nav-registro">
        <div class="nav-highlight-circle">
          <span class="nav-icon-plus">⚽</span>
        </div>
        <span class="nav-label">Registrar</span>
      </button>

      <button class="nav-item" data-page="historico" id="nav-historico">
        <span class="nav-icon">📜</span>
        <span class="nav-label">Histórico</span>
      </button>

      <button class="nav-item" data-page="jugadores" id="nav-jugadores">
        <span class="nav-icon">👥</span>
        <span class="nav-label">Colegas</span>
      </button>
    </nav>

  </div>

  <!-- ===== MODAL UNIVERSAL ===== -->
  <div id="modal-overlay" class="modal-overlay" aria-hidden="true"></div>
  <div id="modal-container" class="modal-container" aria-hidden="true">
    <div class="modal-handle-bar"></div>
    <div id="modal-content" class="modal-inner-content"></div>
  </div>

  <!-- ===== TOAST NOTIFICATIONS ===== -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="data.js"></script>
  <script src="components/ranking.js"></script>
  <script src="components/equipos.js"></script>
  <script src="components/registro.js"></script>
  <script src="components/votacion.js"></script>
  <script src="components/historico.js"></script>
  <script src="components/jugadores.js"></script>
  <script src="app.js"></script>
</body>
</html>
